name: 清理旧 Actions 运行记录

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 保留最近 5 条，其余删除
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh run list --repo "$REPO" --workflow apk.yml --limit 1000 --json databaseId,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[5:] | .[].databaseId')
          for id in $ids; do
            gh run delete "$id" --repo "$REPO"
          done
