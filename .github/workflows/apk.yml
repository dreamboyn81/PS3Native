name: 自动镜像 PS3Native APK

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取上游最新成功 run 信息与更新日志
        id: info
        run: |
          RUN=$(curl -s "https://api.github.com/repos/maxjivi05/PS3Native/actions/workflows/android.yml/runs?status=success&per_page=1" \
            -H "Accept: application/vnd.github+json")

          RUN_ID=$(echo "$RUN" | jq -r '.workflow_runs[0].id')
          HEAD_SHA=$(echo "$RUN" | jq -r '.workflow_runs[0].head_sha' | cut -c1-7)

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "sha=$HEAD_SHA" >> $GITHUB_OUTPUT

          RUN_URL="https://github.com/maxjivi05/PS3Native/actions/runs/$RUN_ID"
          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT

          CHANGELOG=$(curl -s "https://api.github.com/repos/maxjivi05/PS3Native/commits?author=maxjivi05&per_page=5" \
            -H "Accept: application/vnd.github+json" \
            | jq -r '.[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])"')

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 检查是否有新提交
        id: check_new
        run: |
          LATEST_RELEASE_TAG=$(git tag --list 'latest' --sort=-creatordate | head -1)

          if [ -z "$LATEST_RELEASE_TAG" ]; then
            echo "new=true" >> $GITHUB_OUTPUT
            echo "首次运行，无历史 Release"
          else
            # 获取上次 release 关联的 commit sha
            LAST_SHA=$(git tag -l --format='%(contents)' "$LATEST_RELEASE_TAG" | grep "提交:" | awk '{print $2}' | tr -d '`')
            
            if [ "$LAST_SHA" == "${{ steps.info.outputs.sha }}" ]; then
              echo "new=false" >> $GITHUB_OUTPUT
              echo "没有新提交，跳过本次同步"
            else
              echo "new=true" >> $GITHUB_OUTPUT
              echo "检测到新提交，继续同步"
            fi
          fi

      - name: 下载全部 Artifact
        if: steps.check_new.outputs.new == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: maxjivi05/PS3Native
          run_id: ${{ steps.info.outputs.run_id }}
          path: apk

      - name: 整理 APK
        if: steps.check_new.outputs.new == 'true'
        run: |
          mkdir -p out
          find apk -name "*.apk" -exec cp {} out/ \;

      - name: 发布 / 更新 Release
        if: steps.check_new.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PS3Native ${{ steps.info.outputs.sha }}
          body: |
            自动镜像自 [maxjivi05/PS3Native](https://github.com/maxjivi05/PS3Native)

            - 提交: `${{ steps.info.outputs.sha }}`
            - Run: ${{ steps.info.outputs.run_url }}

            ## 最近更新
            ${{ steps.info.outputs.changelog }}

            [查看完整更新日志 »](https://github.com/maxjivi05/PS3Native/commits?author=maxjivi05)
          files: out/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
