name: 自动镜像 PS3Native APK

on:
  schedule:
    - cron: '0 * * * *'   # 每小时检查一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 获取原仓库最新成功 run 信息
        id: info
        run: |
          RUN=$(curl -s "https://api.github.com/repos/maxjivi05/PS3Native/actions/workflows/android.yml/runs?status=success&per_page=1" \
            -H "Accept: application/vnd.github+json")
          
          RUN_ID=$(echo "$RUN" | jq -r '.workflow_runs[0].id')
          UPDATED=$(echo "$RUN" | jq -r '.workflow_runs[0].updated_at')
          HEAD_SHA=$(echo "$RUN" | jq -r '.workflow_runs[0].head_sha' | cut -c1-7)
          
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "最新成功 run: $RUN_ID ($HEAD_SHA) @ $UPDATED"

      - name: 下载对应 Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: maxjivi05/PS3Native
          run_id: ${{ steps.info.outputs.run_id }}
          name: ps3native-standard-debug
          path: apk

      - name: 发布 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PS3Native ${{ steps.info.outputs.sha }}
          body: |
            自动镜像自 [maxjivi05/PS3Native](https://github.com/maxjivi05/PS3Native)
            
            - 对应 run: https://github.com/maxjivi05/PS3Native/actions/runs/${{ steps.info.outputs.run_id }}
            - 提交: `${{ steps.info.outputs.sha }}`
            - 时间: ${{ steps.info.outputs.updated }}
          files: apk/**/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
