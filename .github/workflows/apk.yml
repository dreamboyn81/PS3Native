name: 自动镜像 PS3Native APK

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 获取上游最新成功 run 信息与更新日志
        id: info
        run: |
          RUN=$(curl -s "https://api.github.com/repos/maxjivi05/PS3Native/actions/workflows/android.yml/runs?status=success&per_page=1" \
            -H "Accept: application/vnd.github+json")

          RUN_ID=$(echo "$RUN" | jq -r '.workflow_runs[0].id')
          HEAD_SHA=$(echo "$RUN" | jq -r '.workflow_runs[0].head_sha' | cut -c1-7)

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "sha=$HEAD_SHA" >> $GITHUB_OUTPUT

          RUN_URL="https://github.com/maxjivi05/PS3Native/actions/runs/$RUN_ID"
          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT

          # 拉上游最近 5 条 commit
          CHANGELOG=$(curl -s "https://api.github.com/repos/maxjivi05/PS3Native/commits?author=maxjivi05&per_page=5" \
            -H "Accept: application/vnd.github+json" \
            | jq -r '.[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])"')

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 下载 Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: maxjivi05/PS3Native
          run_id: ${{ steps.info.outputs.run_id }}
          name: ps3native-standard-debug
          path: apk

      - name: 发布 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PS3Native ${{ steps.info.outputs.sha }}
          body: |
            自动镜像自 [maxjivi05/PS3Native](https://github.com/maxjivi05/PS3Native)

            - 提交: `${{ steps.info.outputs.sha }}`
            - Run: ${{ steps.info.outputs.run_url }}

            ## 最近更新
            ${{ steps.info.outputs.changelog }}

            [查看完整更新日志 »](https://github.com/maxjivi05/PS3Native/commits?author=maxjivi05)
          files: apk/**/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
