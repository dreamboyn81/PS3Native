name: Cleanup old workflow runs

on:
  schedule:
    - cron: '0 3 * * 0'   # 每周日 UTC 03:00 自动清理
  workflow_dispatch:       # 支持手动触发

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7            # 只保留最近 7 天的运行
          keep_minimum_runs: 5      # 每个工作流至少保留最近 5 次
